---
name: Atmosphere Weather
description: Your weather planning at a glance
strategy: polling
polling_verb: get
polling_url: 'https://weatherapi.market.xiaomi.com/wtr-v3/weather/all?latitude={{ lat_lon | split: "," | first | strip | url_encode }}&longitude={{ lat_lon | split: "," | last | strip | url_encode }}&days=7&appKey=weather20151024&sign=zUFJoAR2ZVrDy1vF3D07&isGlobal=true&locale=en_us'
polling_headers: ''
polling_body: ''
refresh_interval: 60
framework_version: '3.4.6'
serverless_language: none
icon: media/icon.svg
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
  - keyname: lat_lon
    field_type: lat_lon
    name: Location
    description: 'Search for a city, address or postal code, or enter latitude, longitude.'
  - keyname: temperature_unit
    field_type: select
    name: Temperature unit
    default: celsius
    options:
      - Celsius: celsius
      - Fahrenheit: fahrenheit
  - keyname: author_bio
    field_type: author_bio
    name: About This Plugin
    description: >-
      Get current weather and a clear forecast on your TRMNL with Atmosphere. Choose a
      location using a city, postal code, address or latitude and longitude, and see the
      current temperature, hourly outlook and coming days in a layout designed for e-paper
      screens. <br/><br/> The full view can include wind, humidity, sunrise, sunset, UV
      information and weather alerts when the provider supplies them. Change between Celsius
      and Fahrenheit in the settings. <br/><br/> Atmosphere fetches forecasts through Xiaomi
      Weather's public endpoint, which returned AccuWeather data in our tested locations.
      <br/><br/>
      This is a simple weather dashboard for everyday planning, indoors or at your desk.
      Created by Ivan Perez.
    category: environment
    github_url: https://github.com/taichikuji/trmnl-xiaomi-weather-plugin
    learn_more_url: https://github.com/taichikuji/trmnl-xiaomi-weather-plugin/tree/main/TRMNL#setup
