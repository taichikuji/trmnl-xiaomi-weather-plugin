---
name: Atmosphere · Xiaomi Weather
description: A quiet window on the weather
strategy: polling
polling_verb: get
polling_url: '{% assign point = coordinates | default: "" | strip %}{% if point != "" %}https://weatherapi.market.xiaomi.com/wtr-v3/location/city/geo?latitude={{ point | split: "," | first | strip | url_encode }}&longitude={{ point | split: "," | last | strip | url_encode }}&locale=en_us{% else %}https://weatherapi.market.xiaomi.com/wtr-v3/location/city/search?name={{ location | split: "," | first | strip | url_encode }}&locale=en_us{% endif %}'
polling_headers: ''
polling_body: ''
refresh_interval: 30
framework_version: '3.4.0'
serverless_language: node
icon: media/icon.svg
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
  - keyname: location
    field_type: string
    name: Location
    default: 'Barcelona, Spain'
    optional: true
    maxlength: 120
    description: 'Used when Coordinates is blank. Enter a full city name and country, e.g. Barcelona, Spain or Paris, France.'
    help_text: 'Add the region if needed, e.g. Paris, Texas, United States. Use full names rather than abbreviations such as BCN or NY.'
  - keyname: coordinates
    field_type: string
    name: Coordinates
    optional: true
    default: ''
    maxlength: 80
    placeholder: '48.8584, 2.2945'
    description: 'Optional latitude, longitude in decimal degrees. Takes priority over Location; leave blank to use the city name.'
    help_text: 'Find your coordinates at <a href="https://www.latlong.net/" class="underline">latlong.net</a>. Enter latitude first, then longitude, separated by a comma.'
  - keyname: temperature_unit
    field_type: select
    name: Temperature unit
    default: celsius
    options:
      - Celsius: celsius
      - Fahrenheit: fahrenheit
  - keyname: author_bio
    field_type: author_bio
    name: About This Plugin
    description: 'Created by Ivan Perez. A quiet weather display using Xiaomi forecasts, with dedicated layouts for TRMNL OG and TRMNL X.'
    category: environment
    github_url: https://github.com/taichikuji/trmnl-xiaomi-weather-plugin
