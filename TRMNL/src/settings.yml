---
name: Xiaomi Weather
description: Weather forecasts from Xiaomi
strategy: polling
polling_verb: get
polling_url: 'https://weatherapi.market.xiaomi.com/wtr-v3/location/city/geo?latitude={{ lat_lon | split: "," | first | strip | url_encode }}&longitude={{ lat_lon | split: "," | last | strip | url_encode }}&locale=en_us'
polling_headers: ''
polling_body: ''
refresh_interval: 30
framework_version: '3.4.0'
serverless_language: node
icon: media/icon.svg
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
  - keyname: lat_lon
    field_type: lat_lon
    name: Location
    description: 'Search for a city, address or postal code, or enter latitude, longitude.'
  - keyname: temperature_unit
    field_type: select
    name: Temperature unit
    default: celsius
    options:
      - Celsius: celsius
      - Fahrenheit: fahrenheit
  - keyname: author_bio
    field_type: author_bio
    name: About This Plugin
    description: 'Created by Ivan Perez. This plugin displays current conditions and forecasts for your chosen location using Xiaomi weather data.'
    category: environment
    github_url: https://github.com/taichikuji/trmnl-xiaomi-weather-plugin
    learn_more_url: https://github.com/taichikuji/trmnl-xiaomi-weather-plugin/tree/main/TRMNL#setup
