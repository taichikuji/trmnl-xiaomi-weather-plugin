---
name: Atmosphere · Xiaomi Weather
description: A quiet window on the weather
strategy: polling
polling_verb: get
polling_url: 'https://weatherapi.market.xiaomi.com/wtr-v3/location/city/search?name={{ location | split: "," | first | strip | url_encode }}&locale=en_us'
polling_headers: ''
polling_body: ''
refresh_interval: 30
framework_version: '3.4.0'
serverless_language: node
icon: media/icon.svg
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
  - keyname: location
    field_type: string
    name: Location
    default: 'Barcelona, Spain'
    maxlength: 120
    description: 'Enter a full city name and country, e.g. Barcelona, Spain or Paris, France. The weather location and display name are resolved automatically.'
    help_text: 'Add the region if needed, e.g. Paris, Texas, United States. Use full names rather than abbreviations such as BCN or NY.'
  - keyname: temperature_unit
    field_type: select
    name: Temperature unit
    default: celsius
    options:
      - Celsius: celsius
      - Fahrenheit: fahrenheit
  - keyname: author_bio
    field_type: author_bio
    name: About This Plugin
    description: 'Created by Ivan Perez. A quiet weather display using Xiaomi forecasts, with dedicated layouts for TRMNL OG and TRMNL X.'
    category: environment
    github_url: https://github.com/taichikuji/trmnl-xiaomi-weather-plugin
