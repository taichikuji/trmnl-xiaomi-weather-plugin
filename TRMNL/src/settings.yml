---
name: Atmosphere Weather
description: Plan your day. See what's ahead.
strategy: polling
polling_verb: get
polling_url: 'https://weatherapi.market.xiaomi.com/wtr-v3/weather/all?latitude={{ lat_lon | split: "," | first | strip | url_encode }}&longitude={{ lat_lon | split: "," | last | strip | url_encode }}&days=7&appKey=weather20151024&sign=zUFJoAR2ZVrDy1vF3D07&isGlobal=true&locale=en_us'
polling_headers: ''
polling_body: ''
refresh_interval: 60
framework_version: '3.4.6'
serverless_language: none
icon: media/icon.svg
no_screen_padding: 'no'
dark_mode: 'no'
custom_fields:
  - keyname: lat_lon
    field_type: lat_lon
    name: Location
    description: 'Search for a city, address or postal code, or enter latitude, longitude.'
  - keyname: temperature_unit
    field_type: select
    name: Temperature unit
    default: celsius
    options:
      - Celsius: celsius
      - Fahrenheit: fahrenheit
  - keyname: author_bio
    field_type: author_bio
    name: About This Plugin
    description: >-
      Plan around the hours and days ahead with Atmosphere on your TRMNL. The Full view
      combines an hourly outlook with a five-day forecast, so you can see temperature changes,
      rain chances and upcoming conditions in one place. Current weather remains available
      at a glance. <br/><br/> Choose a location by city, address, postal code or coordinates,
      and switch between Celsius and Fahrenheit. The Full view also shows wind, humidity,
      sunrise, sunset, UV and provider-reported alerts when available. Half layouts show
      three daily forecasts, while Quadrant keeps the essentials. <br/><br/> Forecasts come
      from Xiaomi Weather's public endpoint, which returned AccuWeather data in our tested
      locations. No personal API key or separate server is required. Created by Ivan Perez.
    category: environment
    github_url: https://github.com/taichikuji/trmnl-xiaomi-weather-plugin
    learn_more_url: https://github.com/taichikuji/trmnl-xiaomi-weather-plugin/tree/main/TRMNL#setup
